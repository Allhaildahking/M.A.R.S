name: Live Research Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-research:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify API key is available
        run: |
          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "::error::GEMINI_API_KEY is not available to this workflow. Check the repository secret name and Actions access."
            exit 1
          fi
          echo "GEMINI_API_KEY is available. Value will not be displayed."
      - name: Install M.A.R.S.
        run: python -m pip install -e .
      - name: Run live Gemini research test
        run: python scripts/smoke_test_research.py
