[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mars-ai"
version = "0.1.0"
description = "Multifunctional Autonomous Reasoning System"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Destiny Growrich" }]
dependencies = [
  "google-genai>=1.38.0",
  "pydantic>=2.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
